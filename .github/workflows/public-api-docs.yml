name: Public API documentation

"on":
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  public-api-docs:
    name: Check public API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust crate
        id: crate
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Rust crate exists at the repository root; public API documentation enforcement is inactive until Cargo.toml is added." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Rust 1.86.0
        if: steps.crate.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: clippy
      - name: Check public API documentation
        if: steps.crate.outputs.exists == 'true'
        run: cargo clippy --all-targets --all-features -- -D missing_docs
