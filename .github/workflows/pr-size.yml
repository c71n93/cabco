name: PR size

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# pull_request_target supplies a writable token for fork PRs. This workflow must
# never check out or execute code from the pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  enforce:
    name: Enforce 255-line PR size limit
    runs-on: ubuntu-latest
    steps:
      - name: Label PR and enforce size ceiling
        # v1.12.0 paginates file counts when exclusions are configured.
        uses: CodelyTV/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Exclusive cutoffs: XS 0–15, S 16–63, M 64–127, L 128–255; XL fails.
          xs_max_size: 16
          s_max_size: 64
          m_max_size: 128
          l_max_size: 256
          fail_if_xl: true
          files_to_ignore: Cargo.lock
          message_if_xl: "This PR exceeds the limit of 255 counted lines (additions plus deletions, excluding only the root Cargo.lock). Please split it into smaller, coherent changes with their relevant tests."
