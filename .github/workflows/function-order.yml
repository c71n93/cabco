name: Rust function visibility order

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  function-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust function order
        run: npx --yes --package @ast-grep/cli@0.50.0 ast-grep scan --rule .github/function-order.yml
